services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnipro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnipro
      POSTGRES_PASSWORD: omnipro
      POSTGRES_DB: omnipro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnipro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
